<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QSAR Model Predictor</title>
    <link rel="stylesheet" href="style.css?v=2">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body>
    <div class="background"></div>

    <div class="container">
        <header>
            <h1>QSAR <span class="highlight">Predictor</span></h1>
            <p>Deep Learning-Driven pIC50 Prediction</p>
        </header>

        <main>
            <div class="input-group">
                <label for="smilesInput">Enter SMILES String</label>
                <div class="input-wrapper">
                    <input type="text" id="smilesInput" placeholder="e.g. CCOc1ccc2nc(N)nc(N)c2c1" autocomplete="off">
                    <button id="predictBtn">Predict</button>
                </div>
            </div>

            <div class="result-container" id="resultContainer">
                <div class="result-card">
                    <h2>Predicted pIC50</h2>
                    <div class="value" id="predictionValue">--</div>
                    <div class="status" id="predictionStatus">Ready to predict</div>
                </div>

                <!-- NEW: ChEMBL Details -->
                <div class="result-card hidden" id="chemblCard">
                    <h2>ChEMBL Details</h2>
                    <div class="chembl-data" id="chemblData">
                        <p>Loading...</p>
                    </div>
                </div>

                <!-- NEW: Docking -->
                <div class="result-card hidden" id="dockingCard">
                    <h2>Docking Preparation</h2>
                    <p class="desc">Generate a 3D structure (.pdb) for molecular docking.</p>
                    <button class="secondary-btn" id="generate3dBtn">Generate 3D Structure</button>
                    <div id="downloadArea" class="hidden">
                        <a href="#" id="downloadLink" class="download-link" download>Download .pdb</a>
                        <div class="docking-links">
                            <span>Upload to:</span>
                            <a href="http://www.swissdock.ch/" target="_blank">SwissDock</a>
                            <a href="https://clab.labshare.cn/cb-dock/php/index.php" target="_blank">CB-Dock</a>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <footer>
            <p>Powered by TensorFlow & RDKit</p>
        </footer>
    </div>

    <script src="script.js?v=2"></script>
</body>

</html>
